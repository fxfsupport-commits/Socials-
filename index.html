  <style>
    /* ==========================================================================
       RESET & BASE THEME
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-black: #050507;
      --glow-crimson: #e11d48;
      --glow-ruby: #be123c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 1.5rem;
    }

    /* ==========================================================================
       INFINITE MOVEMENT RED GLOW BACKGROUND
       ========================================================================== */
    .ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Soft vignette edge shading */
    .ambient-canvas::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(5, 5, 7, 0.9) 90%);
      pointer-events: none;
    }

    /* Glowing orbs moving in a continuous figure-8 infinity path */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.6;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .glow-orb-1 {
      width: clamp(280px, 44vw, 580px);
      height: clamp(280px, 44vw, 580px);
      background: radial-gradient(circle, rgba(225, 29, 72, 0.85) 0%, rgba(159, 18, 57, 0.45) 50%, transparent 75%);
      top: 50%;
      left: 50%;
      margin-top: calc(-1 * clamp(140px, 22vw, 290px));
      margin-left: calc(-1 * clamp(140px, 22vw, 290px));
      animation: infinityMotion1 16s ease-in-out infinite alternate;
    }

    .glow-orb-2 {
      width: clamp(240px, 36vw, 480px);
      height: clamp(240px, 36vw, 480px);
      background: radial-gradient(circle, rgba(244, 63, 94, 0.75) 0%, rgba(190, 18, 60, 0.35) 55%, transparent 75%);
      top: 50%;
      left: 50%;
      margin-top: calc(-1 * clamp(120px, 18vw, 240px));
      margin-left: calc(-1 * clamp(120px, 18vw, 240px));
      animation: infinityMotion2 20s ease-in-out infinite;
    }

    @keyframes infinityMotion1 {
      0% {
        transform: translate(-140px, -50px) scale(0.95);
        opacity: 0.45;
      }
      25% {
        transform: translate(0px, 60px) scale(1.15);
        opacity: 0.65;
      }
      50% {
        transform: translate(140px, -50px) scale(0.92);
        opacity: 0.5;
      }
      75% {
        transform: translate(0px, -60px) scale(1.12);
        opacity: 0.62;
      }
      100% {
        transform: translate(-140px, -50px) scale(0.95);
        opacity: 0.45;
      }
    }

    @keyframes infinityMotion2 {
      0% {
        transform: translate(120px, 50px) scale(1.1);
        opacity: 0.5;
      }
      25% {
        transform: translate(0px, -55px) scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: translate(-120px, 50px) scale(1.15);
        opacity: 0.45;
      }
      75% {
        transform: translate(0px, 60px) scale(0.95);
        opacity: 0.65;
      }
      100% {
        transform: translate(120px, 50px) scale(1.1);
        opacity: 0.5;
      }
    }

    /* ==========================================================================
       CONTAINER & HEADER
       ========================================================================== */
    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;
    }

    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.25rem;
    }

    .logo-container {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 24px;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(225, 29, 72, 0.6) 50%, rgba(0, 0, 0, 0.8) 100%);
      box-shadow: 0 10px 30px -5px rgba(225, 29, 72, 0.4), 0 0 20px rgba(225, 29, 72, 0.2);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-container:hover {
      transform: scale(1.06) rotate(2deg);
    }

    .logo-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 21px;
      display: block;
      background: #000;
    }

    .brand-title {
      font-size: clamp(1.85rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 40px rgba(225, 29, 72, 0.3);
    }

    .brand-title span {
      background: linear-gradient(135deg, #ffffff 30%, #fda4af 70%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: clamp(0.875rem, 1.8vw, 1.05rem);
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      max-width: 520px;
    }

    /* ==========================================================================
       3D GLOSSY JELLY BUTTONS GRID
       ========================================================================== */
    .buttons-container {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2rem 2.25rem;
      padding: 1rem 0;
    }

    .jelly-link {
      display: inline-block;
      text-decoration: none;
      position: relative;
      cursor: pointer;
      outline: none;
      perspective: 700px;
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .jelly-link:focus-visible .jelly-btn {
      outline: 2px solid #ffffff;
      outline-offset: 6px;
    }

    .jelly-btn {
      position: relative;
      width: 106px;
      height: 106px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 40% 60% 65% 35% / 55% 45% 55% 45%;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
      overflow: hidden;
      will-change: transform, box-shadow;
    }

    .jelly-link:hover .jelly-btn {
      transform: translateY(-8px) scale(1.08) rotate(-2deg);
    }

    .jelly-link:active .jelly-btn {
      transform: translateY(2px) scale(0.96);
    }

    /* Top-Left Gloss Specular Dome */
    .jelly-btn::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 14%;
      width: 52%;
      height: 44%;
      border-radius: 50% 50% 45% 55% / 60% 60% 40% 40%;
      background: radial-gradient(ellipse at 42% 35%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.45) 35%, transparent 70%);
      pointer-events: none;
      z-index: 3;
      transform: rotate(-18deg);
    }

    /* Bottom Caustic & Rim Glow */
    .jelly-btn::after {
      content: "";
      position: absolute;
      bottom: 6%;
      right: 12%;
      width: 60%;
      height: 38%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 55% 65%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.08) 45%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }

    /* SVG Icon inside button */
    .jelly-icon {
      width: 44px;
      height: 44px;
      fill: #ffffff;
      position: relative;
      z-index: 4;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.35));
      transition: transform 0.35s ease;
    }

    /* Picture / Image Icon inside button (FXF Support) */
    .jelly-img-icon {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 12px;
      position: relative;
      z-index: 4;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
      transition: transform 0.35s ease;
    }

    .jelly-link:hover .jelly-icon,
    .jelly-link:hover .jelly-img-icon {
      transform: scale(1.12);
    }

    /* ==========================================================================
       THE 5 BUTTON THEMES
       ========================================================================== */

    /* 1. TikTok */
    .btn-tiktok {
      background: radial-gradient(circle at 35% 30%, #202028 0%, #111116 55%, #050508 100%);
      box-shadow: 
        0 14px 30px -4px rgba(254, 44, 85, 0.55),
        0 6px 18px rgba(37, 244, 238, 0.4),
        inset 0 3px 5px rgba(255, 255, 255, 0.65),
        inset 0 -8px 12px rgba(0, 0, 0, 0.8);
    }
    .jelly-link:hover .btn-tiktok {
      box-shadow: 
        0 22px 42px -4px rgba(254, 44, 85, 0.8),
        0 8px 22px rgba(37, 244, 238, 0.6),
        inset 0 3px 6px rgba(255, 255, 255, 0.9),
        inset 0 -8px 14px rgba(0, 0, 0, 0.9);
    }

    /* 2. Instagram */
    .btn-instagram {
      background: radial-gradient(circle at 25% 25%, #ffb703 0%, #ff007f 45%, #9d0208 75%, #5a189a 100%);
      box-shadow: 
        0 14px 30px -4px rgba(225, 29, 72, 0.65),
        0 6px 16px rgba(0, 0, 0, 0.6),
        inset 0 3px 5px rgba(255, 255, 255, 0.6),
        inset 0 -8px 12px rgba(0, 0, 0, 0.4);
    }
    .jelly-link:hover .btn-instagram {
      box-shadow: 
        0 22px 42px -4px rgba(225, 29, 72, 0.85),
        0 8px 20px rgba(0, 0, 0, 0.7),
        inset 0 3px 6px rgba(255, 255, 255, 0.8),
        inset 0 -8px 14px rgba(0, 0, 0, 0.45);
    }

    /* 3. YouTube */
    .btn-youtube {
      background: radial-gradient(circle at 35% 30%, #ff2a4d 0%, #d90429 55%, #7a0014 100%);
      box-shadow: 
        0 14px 30px -4px rgba(217, 4, 41, 0.65),
        0 6px 16px rgba(0, 0, 0, 0.6),
        inset 0 3px 5px rgba(255, 255, 255, 0.6),
        inset 0 -8px 12px rgba(0, 0, 0, 0.4);
    }
    .jelly-link:hover .btn-youtube {
      box-shadow: 
        0 22px 42px -4px rgba(217, 4, 41, 0.85),
        0 8px 20px rgba(0, 0, 0, 0.7),
        inset 0 3px 6px rgba(255, 255, 255, 0.8),
        inset 0 -8px 14px rgba(0, 0, 0, 0.45);
    }

    /* 4. Telegram */
    .btn-telegram {
      background: radial-gradient(circle at 35% 30%, #38bdf8 0%, #0088cc 55%, #004b73 100%);
      box-shadow: 
        0 14px 30px -4px rgba(0, 136, 204, 0.65),
        0 6px 16px rgba(0, 0, 0, 0.6),
        inset 0 3px 5px rgba(255, 255, 255, 0.6),
        inset 0 -8px 12px rgba(0, 0, 0, 0.4);
    }
    .jelly-link:hover .btn-telegram {
      box-shadow: 
        0 22px 42px -4px rgba(0, 136, 204, 0.85),
        0 8px 20px rgba(0, 0, 0, 0.7),
        inset 0 3px 6px rgba(255, 255, 255, 0.8),
        inset 0 -8px 14px rgba(0, 0, 0, 0.45);
    }

    /* 5. FXF Support: Black and Glowing Red Theme */
    .btn-fxf-support {
      background: radial-gradient(circle at 35% 30%, #2a080e 0%, #140204 45%, #020203 100%);
      box-shadow: 
        0 16px 36px -4px rgba(225, 29, 72, 0.85),
        0 0 24px rgba(244, 63, 94, 0.4),
        0 6px 16px rgba(0, 0, 0, 0.9),
        inset 0 3px 6px rgba(255, 255, 255, 0.7),
        inset 0 -8px 14px rgba(225, 29, 72, 0.5);
      border: 1px solid rgba(225, 29, 72, 0.4);
    }
    .jelly-link:hover .btn-fxf-support {
      box-shadow: 
        0 24px 48px -4px rgba(225, 29, 72, 1),
        0 0 32px rgba(244, 63, 94, 0.65),
        0 8px 24px rgba(0, 0, 0, 0.95),
        inset 0 3px 8px rgba(255, 255, 255, 0.9),
        inset 0 -8px 16px rgba(225, 29, 72, 0.7);
      border-color: rgba(244, 63, 94, 0.7);
    }

    .link-caption {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      opacity: 0.75;
      transition: all 0.3s ease;
    }

    .jelly-link:hover .link-caption {
      opacity: 1;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .caption-fxf {
      color: #fca5a5;
      text-shadow: 0 0 10px rgba(225, 29, 72, 0.5);
    }
    .jelly-link:hover .caption-fxf {
      color: #ffffff;
      text-shadow: 0 0 14px rgba(244, 63, 94, 0.8);
    }

    /* Direct Copy Toolbar */
    .top-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .btn-action {
      background: rgba(225, 29, 72, 0.2);
      color: #fff;
      border: 1px solid rgba(225, 29, 72, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(225, 29, 72, 0.4);
      border-color: rgba(244, 63, 94, 0.7);
      transform: translateY(-1px);
    }

    .footer-section {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      padding-top: 2rem;
    }

    /* ==========================================================================
       RESPONSIVENESS
       ========================================================================== */
    @media (max-width: 768px) {
      body { padding: 2rem 1rem; }
      .page-wrapper { gap: 2.75rem; }
      .buttons-container { gap: 1.5rem 1.25rem; }
      .jelly-btn { width: 90px; height: 90px; }
      .jelly-icon { width: 38px; height: 38px; }
      .jelly-img-icon { width: 42px; height: 42px; }
      .logo-container { width: 76px; height: 76px; }
    }

    @media (max-width: 480px) {
      .buttons-container { gap: 1.25rem 1rem; }
      .jelly-btn { width: 80px; height: 80px; }
      .jelly-icon { width: 32px; height: 32px; }
      .jelly-img-icon { width: 36px; height: 36px; }
      .link-caption { font-size: 0.75rem; }
    }
  </style>
</head>

  <!-- JAVASCRIPT: 3D PERSPECTIVE TILT TRACKING -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const links = document.querySelectorAll('.jelly-link');

      links.forEach(link => {
        const btn = link.querySelector('.jelly-btn');

        link.addEventListener('mousemove', (e) => {
          const rect = link.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;

          const rotateX = (-y / rect.height) * 22;
          const rotateY = (x / rect.width) * 22;

          btn.style.transform = `translateY(-8px) scale(1.08) perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        link.addEventListener('mouseleave', () => {
          btn.style.transform = '';
        });
      });
    });
  </script>
